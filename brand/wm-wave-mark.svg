<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 400" width="940" height="400">
  <!--
    Whitty Media wave mark — from Preston/Patrick's freehand sketch (Test.png).
    One continuous zigzag: the W's final upstroke IS the M's first upstroke
    (shared-stroke ligature). The color hands off from black to gold on that
    shared diagonal — gold overlaps the black tip so the wave never breaks.
    Light-background version: black W, gold M.
  -->
  <!-- W: left tip, bottom, inner peak, bottom, then up the shared diagonal -->
  <path d="M 40 90 L 155 330 L 260 150 L 365 330 L 436.3 168.8"
        fill="none" stroke="#0B0B0C" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- M: takes over on the shared diagonal, full peak, valley, peak, right foot -->
  <path d="M 411 226 L 480 70 L 595 230 L 710 70 L 850 330"
        fill="none" stroke="#D4AF37" stroke-width="46"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
