<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Whitty Media — Brand Concepts</title>
<style>
  body{margin:0;background:#111;color:#eee;font-family:'Segoe UI',Arial,sans-serif;padding:40px}
  h1{font-weight:500;font-size:22px;letter-spacing:.08em}
  h2{font-weight:500;font-size:15px;color:#C9A227;margin:40px 0 14px;letter-spacing:.1em;text-transform:uppercase}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
  figure{margin:0;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:8px;padding:18px;text-align:center}
  figure img{width:100%;border-radius:4px;background:#fff}
  figure.dark img{background:#0A0A0B}
  figcaption{font-size:12px;color:#999;margin-top:10px;letter-spacing:.05em}
</style>
</head>
<body>
  <h1>WHITTY MEDIA — LOGO CONCEPTS</h1>

  <h2>The wave ligature (from the freehand sketch — shared-stroke W→M)</h2>
  <div class="grid">
    <figure><img src="wm-wave-mark.svg" alt="Wave mark, light"><figcaption>wm-wave-mark.svg (light bg)</figcaption></figure>
    <figure class="dark"><img src="wm-wave-mark-dark.svg" alt="Wave mark, dark"><figcaption>wm-wave-mark-dark.svg</figcaption></figure>
    <figure class="dark"><img src="wm-wave-badge.svg" alt="Wave badge"><figcaption>wm-wave-badge.svg (avatar/favicon)</figcaption></figure>
    <figure class="dark"><img src="wm-wave-lockup.svg" alt="Wave lockup"><figcaption>wm-wave-lockup.svg</figcaption></figure>
    <figure><img src="../Test.png" alt="Original sketch"><figcaption>Test.png (the sketch)</figcaption></figure>
  </div>

  <h2>Hand-built vector (rotational ambigram — M is the W rotated 180°)</h2>
  <div class="grid">
    <figure class="dark"><img src="wm-interlock-badge.svg" alt="Interlock badge"><figcaption>wm-interlock-badge.svg</figcaption></figure>
    <figure class="dark"><img src="whitty-media-badge.svg" alt="Wave badge v1"><figcaption>whitty-media-badge.svg (v1 wave)</figcaption></figure>
    <figure class="dark"><img src="whitty-media-lockup.svg" alt="Wave lockup v1"><figcaption>whitty-media-lockup.svg (v1)</figcaption></figure>
  </div>

  <h2>AI-generated concepts (v2, black on white — recolor gold after picking)</h2>
  <div class="grid">
    <figure><img src="concepts/ambigram-v2.png" alt=""><figcaption>ambigram-v2</figcaption></figure>
    <figure><img src="concepts/monoline-wave-v2.png" alt=""><figcaption>monoline-wave-v2</figcaption></figure>
    <figure><img src="concepts/serif-ligature-v2.png" alt=""><figcaption>serif-ligature-v2</figcaption></figure>
    <figure><img src="concepts/negative-space-v2.png" alt=""><figcaption>negative-space-v2</figcaption></figure>
  </div>

  <h2>AI-generated concepts (v1, gold on dark)</h2>
  <div class="grid">
    <figure class="dark"><img src="concepts/ambigram.png" alt=""><figcaption>ambigram</figcaption></figure>
    <figure class="dark"><img src="concepts/negative-space.png" alt=""><figcaption>negative-space</figcaption></figure>
    <figure class="dark"><img src="concepts/monoline-wave.png" alt=""><figcaption>monoline-wave</figcaption></figure>
    <figure class="dark"><img src="concepts/serif-ligature.png" alt=""><figcaption>serif-ligature</figcaption></figure>
    <figure class="dark"><img src="concepts/waveform-peaks.png" alt=""><figcaption>waveform-peaks</figcaption></figure>
    <figure class="dark"><img src="concepts/watchmaker-crest.png" alt=""><figcaption>watchmaker-crest</figcaption></figure>
  </div>
</body>
</html>
