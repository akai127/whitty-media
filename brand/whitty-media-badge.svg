<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1D77E"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8842C"/>
    </linearGradient>
    <linearGradient id="champGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F7ECC8"/>
      <stop offset="55%" stop-color="#EFE0B8"/>
      <stop offset="100%" stop-color="#B89B5E"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F1D77E"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#8C6D1F"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <circle cx="256" cy="256" r="244" fill="#0B0B0C"/>
  <circle cx="256" cy="256" r="238" fill="none" stroke="url(#ringGrad)" stroke-width="9"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#D4AF37" stroke-width="1.5" opacity="0.45"/>

  <!-- W : first half of the wave (gold) -->
  <path d="M 99 196 L 137 316 L 173 234 L 209 316 L 247 196"
        fill="none" stroke="url(#goldGrad)" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- M : second half of the wave (champagne) — break in the middle, parallel upstroke continues the wave -->
  <path d="M 263 316 L 301 196 L 337 278 L 373 196 L 411 316"
        fill="none" stroke="url(#champGrad)" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
